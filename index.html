<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="container">
        <div id="banner">
            <div class="logo">Weekend R&R</div>
            <p>Photo by Mehdi El marouazi @ Unsplash</p>
        </div>
        <div id="content">
            <div class="introduction">
                <h4>This is not a real online service! This is just a project</h4>
                <h4>that I was required to create in order to progress!</h4>
                <h4>Sign up to join our newsletter!</h4>

                <h5>It would be really cool if you did.</h5>
            </div>
            <div class="signUpForm">
                <fieldset class="form-grid">
                    <h3>Sign up for our newsletter!</h3>
                    <label for="first_name">First Name</label>
                    <input type="text" id="first_name" name="first_name">

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email">

                    <label for="user_password">Password</label>
                    <input type="password" id="user_password" name="password">

                    <label for="last_name">Last Name</label>
                    <input type="text" id="last_name" name="last_name">

                    <label for="phone_number">Phone Number</label>
                    <input type="tel" id="phone_number" name="phone_number">

                    <label for="confirm_password">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password">
                </fieldset>

            </div>
            <div class="footer">
                <button class="btn">Create Account</button>
                <p>Already have an account? Log in</p>
            </div>
        </div>
    
    </div>
</body>
</html>
