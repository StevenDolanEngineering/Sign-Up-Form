<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="container">
        <div id="banner">
            <div class="logo">
                <svg xmlns="http://w3.org" height="48" viewBox="0 -960 960 960" width="48" fill="#e3e3e3">
                    <path d="M440-440H200v-80h240v-240h80v240h240v80H560v240h-80v-240Zm40 360q-19 0-36.5-7T413-107l-15-14q-119-108-201-188.5T91.5-472.5Q54-536 37-593.5T20-710q0-104 70.5-177T268-960q59 0 112 25t91 69q38-44 91-69t112-25q107 0 177.5 73T922-710q0 58-16.5 115.5T859-480L801-424l-57-56 59-58q26-26 39.5-68.5T856-710q0-72-47.5-121T692-880q-51 0-96 26.5T522-780h-84q-29-47-74-73.5T268-880q-71 0-119.5 49T100-710q0 46 14.5 90t44 87.5Q187-485 264-415t164 150l12 11-40 34Z"/>
                </svg>
                Weekend R&R
            </div>
            <p>Photo by Mehdi El marouazi @ Unsplash</p>
        </div>
        <div id="content">
            <div class="introduction">
                <h4>This is not a real online service! This is just a project</h4>
                <h4>that I was required to create in order to progress!</h4>
                <h4>Sign up to join our newsletter!</h4>

                <h5>It would be really cool if you did.</h5>
            </div>
            <div class="signUpForm">
                <fieldset class="form-grid">
                    <legend class="form-title">Sign up for our newsletter!</legend>

                    <div class="form-group">
                        <label for="first_name">First Name</label>
                        <input type="text" id="first_name" name="first_name">
                    </div>

                    <div class="form-group">
                        <label for="last_name">Last Name</label>
                        <input type="text" id="last_name" name="last_name">
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email">
                    </div>

                    <div class="form-group">
                        <label for="phone_number">Phone Number</label>
                        <input type="tel" id="phone_number" name="phone_number">
                    </div>

                    <div class="form-group">
                        <label for="user_password">Password</label>
                        <input type="password" id="user_password" name="password">
                    </div>

                    <div class="form-group">
                        <label for="confirm_password">Confirm Password</label>
                        <input type="password" id="confirm_password" name="confirm_password">
                    </div>
                </fieldset>

            </div>
            <div class="footer">
                <button class="btn">Create Account</button>
                <p>Already have an account? <a>Log in</a></p>
            </div>
        </div>
    
    </div>
</body>
</html>
